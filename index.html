<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電腦翻修進銷存 V5.1</title>
    <style>
        :root { 
            --bg-color: #1a1a1a; 
            --card-bg: #222222; 
            --primary: #4caf50; 
            --accent: #2196f3; 
            --text: #e0e0e0; 
            --border: #333; 
            --danger: #f44336; 
        }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #121212; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        /* 標題與狀態 */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        h2 { margin: 0; color: #fff; font-size: 1.5em; font-weight: normal; }
        .sync-status { font-size: 0.85em; color: #888; }

        /* 頂部控制與統計整合列 */
        .control-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 15px; background: #1a1a1a; padding: 10px; border-radius: 6px; }
        .action-btns { display: flex; gap: 10px; flex: 1; max-width: 400px; }
        .stats-group { display: flex; gap: 20px; font-size: 0.95em; color: #ccc; align-items: center; white-space: nowrap; }
        .stats-group b { color: #fff; font-size: 1.1em; }
        .sys-btns { display: flex; gap: 8px; }

        /* 按鈕樣式 */
        .btn { padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .btn-clear { background: #444; color: #eee; flex: 1; }
        .btn-clear:hover { background: #555; }
        .btn-add { background: #4caf50; color: white; flex: 2; font-size: 15px; }
        .btn-add:hover { background: #45a049; }
        .btn-sys { background: #fff; color: #333; font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; display: flex; align-items: center; gap: 4px; font-weight: normal; }
        .btn-sys:hover { background: #eee; }

        /* 輸入表單區塊 */
        .form-grid { display: grid; grid-template-columns: 150px 1fr 120px 140px 120px 120px 140px; gap: 10px; margin-bottom: 20px; background: #1a1a1a; padding: 15px; border-radius: 6px; }
        .form-item { display: flex; flex-direction: column; }
        .form-item label { font-size: 0.85em; color: #aaa; margin-bottom: 6px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #252525; color: white; font-size: 14px; box-sizing: border-box; width: 100%; }
        input:focus, select:focus { border-color: #666; outline: none; }

        /* 資料表格樣式 */
        .desktop-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .desktop-table th { padding: 12px 10px; border-bottom: 1px solid #333; text-align: center; color: #999; font-weight: normal; background: #161616; }
        .desktop-table td { padding: 12px 10px; border-bottom: 1px solid #222; text-align: center; color: #ddd; }
        
        /* 狀態特定樣式 */
        tr.sold-row td { background: #fffde7; color: #121212 !important; } /* 已售出列呈現圖片中的淡黃白底 */
        tr.sold-row td .profit { color: #2e7d32; }
        tr.sold-row td .loss { color: #c62828; }
        tr.sold-row .btn-action { color: #121212; border-color: #666; }

        .profit { color: #4caf50; font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }
        
        /* 操作按鈕 */
        .btn-action { background: transparent; color: #ccc; border: 1px solid #555; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; margin: 0 2px; }
        .btn-action:hover { background: rgba(255,255,255,0.1); }
        .btn-del { color: #ff5252; border-color: #ff5252; }
        .btn-del:hover { background: rgba(255,82,82,0.1); }

        /* 手機端隱藏（保持響應式架構） */
        .mobile-list { display: none; }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .stats-group { justify-content: space-between; }
            .desktop-table { display: none; }
            .mobile-list { display: flex; flex-direction: column; gap: 10px; }
            .card { background: var(--card-bg); padding: 12px; border-radius: 6px; border-left: 4px solid var(--primary); }
            .card.sold-card { background: #fffde7; color: #121212; }
        }
    </style>
</head>
<body>
<div class="container">
    
    <div class="header-row">
        <h2>電腦翻修進銷存 V5.2</h2>

    </div>



    <div class="form-grid">
        <div class="form-item">
            <label>分類</label>
            <select id="in_category">
                <option value="1_整機">1_整機</option>
                <option value="2_主機板">2_主機板</option>
                <option value="3_顯卡">3_顯卡</option>
                <option value="4_CPU">4_CPU</option>
                <option value="5_主機板">5_主機板</option>
                <option value="6_記憶體">6_記憶體</option>
                <option value="7_硬碟">7_硬碟</option>
                <option value="8_風扇">8_風扇</option>
                <option value="9_POWER">9_POWER</option>
            </select>
        </div>
        <div class="form-item">
            <label>品項名稱</label>
            <input id="in_name" placeholder="規格型號">
        </div>
        <div class="form-item">
            <label>成本</label>
            <input id="in_purchase" type="number" value="0">
        </div>
        <div class="form-item">
            <label>買入日期</label>
            <input id="in_buyDate" type="date">
        </div>
        <div class="form-item">
            <label>預計售價</label>
            <input id="in_expect" type="number" value="0">
        </div>
        <div class="form-item">
            <label>實際售價</label>
            <input id="in_actual" type="number" value="0">
        </div>
        <div class="form-item">
            <label>賣出日期</label>
            <input id="in_sellDate" type="date">
        </div>
    </div>

    <div class="control-bar">
        <div class="action-btns">
            <button class="btn btn-clear" onclick="resetForm()">清除</button>
            <button id="mainBtn" class="btn btn-add" onclick="handleSubmit()">新增</button>
        </div>
        
        <div class="stats-group">
            <div>在庫：<b id="count_stock">0</b></div>
            <div>已售：<b id="count_sold">0</b></div>
            <div>總獲利：<b id="total_profit">$0</b></div>
        </div>

        <div class="sys-btns">
            <button class="btn btn-sys" onclick="loadFromCloud()">🔄 同步</button>
            <button class="btn btn-sys" onclick="alert('匯出功能已保留（可對接原本邏輯）')">📤 匯出</button>
            <button class="btn btn-sys" onclick="if(confirm('確定清空手機快取？')){localStorage.clear(); location.reload();}">🗑️ 清空</button>
                    <div id="syncStatus" class="sync-status">📡 正在初始化系統...</div>
        </div>
    </div>

    <span id="editId" style="display:none"></span>

    <table class="desktop-table">
        <thead>
            <tr>
                <th style="width: 15%;">分類</th>
                <th style="width: 35%;">名稱</th>
                <th style="width: 12%;">成本</th>
                <th style="width: 12%;">利潤</th>
                <th style="width: 12%;">狀態</th>
                <th style="width: 14%;">操作</th>
            </tr>
        </thead>
        <tbody id="pc_tbody"></tbody>
    </table>

    <div class="mobile-list" id="mobile_list"></div>
</div>

<script>
    const cloudUrl = "https://script.google.com/macros/s/AKfycby-_TV-2TQ4BEMmEDBRjPFC4Ff3wbp32jJAdCEDrnAUGNrlGclLFkKbB4dcbZooUtpd/exec";
    let data = [];
    try { data = JSON.parse(localStorage.getItem("pcData") || "[]"); } catch(e) { data = []; }
    let isSyncing = false;

    window.onload = () => { render(); loadFromCloud(); setInterval(loadFromCloud, 60000); };

    function loadFromCloud() {
        if (isSyncing) return;
        isSyncing = true;
        const statusEl = document.getElementById("syncStatus");
        statusEl.innerText = "🔄 正在同步雲端...";
        const cbName = "gasCallback_" + Date.now();
        const script = document.createElement("script");
        window[cbName] = (cloudData) => {
            if (Array.isArray(cloudData)) {
                const map = new Map();
                data.forEach(i => { if(i.id) map.set(String(i.id), i); });
                cloudData.forEach(i => { if(i.id) map.set(String(i.id), i); });
                data = Array.from(map.values());
                localStorage.setItem("pcData", JSON.stringify(data));
                render();
                statusEl.innerText = `✅ 同步完成 (${new Date().toLocaleTimeString()})`;
            }
            cleanup();
        };
        function cleanup() { delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); isSyncing = false; }
        script.src = cloudUrl + "?callback=" + cbName + "&t=" + Date.now();
        script.onerror = () => { statusEl.innerText = "⚠️ 離線模式"; isSyncing = false; };
        document.head.appendChild(script);
    }

    async function handleSubmit() {
        const id = document.getElementById("editId").innerText || Date.now().toString();
        const item = {
            id: id,
            category: document.getElementById("in_category").value,
            name: document.getElementById("in_name").value || "未命名",
            purchase: Number(document.getElementById("in_purchase").value) || 0,
            expect: Number(document.getElementById("in_expect").value) || 0,
            actual: Number(document.getElementById("in_actual").value) || 0,
            buyDate: document.getElementById("in_buyDate").value,
            sellDate: document.getElementById("in_sellDate").value
        };
        data = data.filter(i => String(i.id) !== String(id));
        data.push(item);
        localStorage.setItem("pcData", JSON.stringify(data));
        render();
        resetForm();
        try {
            await fetch(cloudUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            loadFromCloud();
        } catch(e) { console.error(e); }
    }

    async function delItem(id) {
        if (!confirm("確定要刪除嗎？雲端也會一併刪除。")) return;
        data = data.filter(i => String(i.id) !== String(id));
        localStorage.setItem("pcData", JSON.stringify(data));
        render();
        try {
            await fetch(cloudUrl, { method: "POST", mode: "no-cors", body: JSON.stringify({ action: "delete", id: id }) });
            loadFromCloud();
        } catch(e) { console.error(e); }
    }

    function render() {
        const pcTbody = document.getElementById("pc_tbody");
        const mobList = document.getElementById("mobile_list");
        pcTbody.innerHTML = ""; mobList.innerHTML = "";
        
        let sCount = 0, soldCount = 0, totalP = 0;
        
        const safeData = data.filter(i => i && i.id).sort((a,b) => {
            const aSold = Number(a.actual) > 0;
            const bSold = Number(b.actual) > 0;
            if (aSold !== bSold) return aSold ? 1 : -1;
            return String(a.category).localeCompare(String(b.category));
        });

        safeData.forEach(i => {
            const purchase = Number(i.purchase) || 0, actual = Number(i.actual) || 0, expect = Number(i.expect) || 0;
            const isSold = actual > 0, profit = (isSold ? actual : expect) - purchase;
            if (isSold) { soldCount++; totalP += profit; } else { sCount++; }
            
            const catName = String(i.category || "").includes('_') ? i.category.split('_')[1] : (i.category || "未分類");
            const rowClass = isSold ? 'sold-row' : '';
            const statusStr = isSold ? '📦 已售' : '📦 在庫';

            // 桌機表格渲染
            pcTbody.innerHTML += `<tr class="${rowClass}">
                <td>${i.category}</td>
                <td style="text-align: left; padding-left: 20px;">${i.name}</td>
                <td>$${purchase}</td>
                <td class="${profit>=0?'profit':'loss'}">$${profit}</td>
                <td>${statusStr}</td>
                <td>
                    <button class="btn-action" onclick="edit('${i.id}')">修改</button>
                    <button class="btn-action btn-del" onclick="delItem('${i.id}')">刪除</button>
                </td>
            </tr>`;

            // 手機版渲染
            mobList.innerHTML += `<div class="card ${isSold?'sold-card':''}" onclick="edit('${i.id}')">
                <div style="display:flex;justify-content:space-between;"><b>${i.name}</b><small>${catName}</small></div>
                <div style="font-size:0.9em;margin-top:5px;">成本:$${purchase} | ${isSold?`售價:$${actual} | 利潤:$${profit}` : `預計:$${expect}`}</div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">
                    <span style="font-size:0.8em;">${statusStr}</span>
                    <button class="btn-action btn-del" onclick="event.stopPropagation(); delItem('${i.id}')">刪除</button>
                </div></div>`;
        });

        document.getElementById("count_stock").innerText = sCount;
        document.getElementById("count_sold").innerText = soldCount;
        document.getElementById("total_profit").innerText = "$" + totalP.toLocaleString();
    }

    function edit(id) {
        const item = data.find(d => String(d.id) === String(id));
        if (!item) return;
        document.getElementById("editId").innerText = item.id;
        document.getElementById("in_category").value = item.category;
        document.getElementById("in_name").value = item.name;
        document.getElementById("in_purchase").value = item.purchase;
        document.getElementById("in_expect").value = item.expect;
        document.getElementById("in_actual").value = item.actual;
        document.getElementById("in_buyDate").value = item.buyDate || "";
        document.getElementById("in_sellDate").value = item.sellDate || "";
        document.getElementById("mainBtn").innerText = "修改並同步";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById("editId").innerText = "";
        document.getElementById("in_name").value = "";
        document.getElementById("mainBtn").innerText = "新增";
        document.querySelectorAll("input[type='number']").forEach(i => i.value = 0);
        document.querySelectorAll("input[type='date']").forEach(i => i.value = "");
    }
</script>
</body>
</html>
