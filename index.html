<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電腦翻修進銷存 - 雲端同步版</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #4caf50;
            --accent: #2196f3;
            --text: #e0e0e0;
            --border: #333;
        }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { text-align: center; color: var(--primary); margin: 15px 0; }

        /* 統計面板 */
        .summary-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .summary-item { flex: 1; background: var(--card-bg); padding: 10px; border-radius: 8px; text-align: center; border-bottom: 3px solid var(--primary); }
        .summary-item span { display: block; font-size: 0.8em; color: #888; }
        .summary-item b { font-size: 1.2em; color: #fff; }

        /* 輸入區域 */
        .input-group { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .input-item { display: flex; flex-direction: column; }
        label { font-size: 0.8em; color: #888; margin-bottom: 4px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-main { background: var(--primary); color: white; flex-grow: 1; }
        .btn-cancel { background: #555; color: white; display: none; }

        /* 佈局：電腦表格 / 手機卡片 */
        .desktop-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; display: none; margin-top: 20px; }
        .desktop-table th, .desktop-table td { padding: 12px; border: 1px solid var(--border); text-align: center; }
        .desktop-table th { background: #252525; color: var(--primary); }

        .mobile-list { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; border-left: 5px solid var(--primary); position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-title { font-weight: bold; font-size: 1.1em; }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.9em; color: #aaa; border-top: 1px solid var(--border); padding-top: 10px; }
        .card-actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-sm { flex: 1; padding: 10px; border-radius: 6px; border: none; font-size: 0.95em; color: white; font-weight: bold; }

        .profit { color: var(--primary); font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }

        @media (min-width: 768px) {
            .desktop-table { display: table; }
            .mobile-list { display: none; }
            .btn-main { flex-grow: 0; min-width: 150px; }
            .input-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .edit-mode { border-color: var(--accent) !important; box-shadow: 0 0 15px rgba(33, 150, 243, 0.4); }
        .syncing { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🖥️ 翻修進銷存系統</h2>

    <div class="summary-bar">
        <div class="summary-item"><span>在庫項目</span><b id="count_stock">0</b></div>
        <div class="summary-item"><span>已售項目</span><b id="count_sold">0</b></div>
        <div class="summary-item"><span>累計獲利</span><b id="total_profit">$0</b></div>
    </div>

    <div class="input-group" id="inputPanel">
        <div class="input-grid">
            <div class="input-item">
                <label>分類</label>
                <select id="in_category">
                    <option value="1_整機">整機</option>
                    <option value="2_主機板">主機板</option>
                    <option value="3_CPU">CPU</option>
                    <option value="4_記憶體">記憶體</option>
                    <option value="5_顯卡">顯卡</option>
                    <option value="6_硬碟">硬碟</option>
                    <option value="7_機殼">機殼</option>
                    <option value="8_風扇">風扇</option>
                    <option value="9_POWER">POWER</option>
                </select>
            </div>
            <div class="input-item">
                <label>品項名稱</label>
                <input id="in_name" placeholder="規格型號">
            </div>
            <div class="input-item">
                <label>收購/總成本</label>
                <input id="in_purchase" type="number" value="0">
            </div>
            <div class="input-item">
                <label>買入日期</label>
                <input id="in_buyDate" type="date">
            </div>
            <div class="input-item">
                <label>預計售價</label>
                <input id="in_expect" type="number" value="0">
            </div>
            <div class="input-item">
                <label>實際售價</label>
                <input id="in_actual" type="number" value="0">
            </div>
            <div class="input-item">
                <label>賣出日期</label>
                <input id="in_sellDate" type="date">
            </div>
        </div>
        <div class="btn-row">
            <span id="editId" style="display:none"></span>
            <button id="cancelBtn" class="btn btn-cancel" onclick="resetForm()">取消</button>
            <button id="mainBtn" class="btn btn-main" onclick="handleSubmit()">新增紀錄</button>
        </div>
    </div>

    <table class="desktop-table">
        <thead>
            <tr>
                <th>分類</th><th>名稱</th><th>成本</th><th>利潤</th><th>ROI</th><th>狀態</th><th>操作</th>
            </tr>
        </thead>
        <tbody id="pc_tbody"></tbody>
    </table>

    <div class="mobile-list" id="mobile_list"></div>
</div>

<script>
    let data = JSON.parse(localStorage.getItem("pcData") || "[]");
    const cloudUrl = "https://script.google.com/macros/s/AKfycbyNOjKiYGzCQ99DVIhWo8731d5kX_Jdvhh1BEaH9-GAwkBD2N1xZJmG0EdbOt2f7H3V/exec";

    // 網頁開啟時先讀本地，再抓雲端
    window.onload = () => {
        render();
        loadFromCloud();
    };

    async function loadFromCloud() {
        try {
            const response = await fetch(cloudUrl);
            const cloudData = await response.json();
            if (cloudData && cloudData.length > 0) {
                data = cloudData;
                save();
                render();
            }
        } catch (e) {
            console.log("雲端同步失敗，使用本地存檔");
        }
    }

    function save() {
        localStorage.setItem("pcData", JSON.stringify(data));
    }

    function calc(item) {
        item.total = Number(item.purchase);
        let finalPrice = item.actual > 0 ? item.actual : item.expect;
        item.profit = finalPrice - item.total;
        item.roi = item.total > 0 ? ((item.profit / item.total) * 100).toFixed(1) : 0;
        
        if(item.buyDate) {
            let d1 = new Date(item.buyDate);
            let d2 = item.sellDate ? new Date(item.sellDate) : new Date();
            item.days = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        } else { item.days = "-"; }
    }

    async function handleSubmit() {
        const id = document.getElementById("editId").innerText;
        const item = {
            id: id || Date.now().toString(),
            category: document.getElementById("in_category").value,
            name: document.getElementById("in_name").value || "未命名",
            purchase: Number(document.getElementById("in_purchase").value),
            expect: Number(document.getElementById("in_expect").value),
            actual: Number(document.getElementById("in_actual").value),
            buyDate: document.getElementById("in_buyDate").value,
            sellDate: document.getElementById("in_sellDate").value
        };
        calc(item);

        if (!id) data.push(item);
        else {
            const idx = data.findIndex(d => d.id === id);
            data[idx] = item;
        }

        data.sort((a, b) => a.category.localeCompare(b.category, 'zh-Hans-CN'));
        save();
        render();
        resetForm();
        
        // 推送到雲端
        try {
            await fetch(cloudUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            // 小技巧：推送後稍等一下再重新載入，確保雲端是最新的
            setTimeout(loadFromCloud, 1000);
        } catch (e) {
            alert("雲端儲存失敗，請檢查網路");
        }
    }

    function edit(id) {
        const item = data.find(d => d.id === id.toString());
        document.getElementById("in_category").value = item.category;
        document.getElementById("in_name").value = item.name;
        document.getElementById("in_purchase").value = item.purchase;
        document.getElementById("in_expect").value = item.expect;
        document.getElementById("in_actual").value = item.actual;
        document.getElementById("in_buyDate").value = item.buyDate;
        document.getElementById("in_sellDate").value = item.sellDate;
        document.getElementById("editId").innerText = item.id;
        document.getElementById("mainBtn").innerText = "儲存修改";
        document.getElementById("mainBtn").style.background = "#2196f3";
        document.getElementById("cancelBtn").style.display = "block";
        document.getElementById("inputPanel").classList.add("edit-mode");
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function del(id) {
        if(confirm("確定刪除此筆紀錄？")) {
            data = data.filter(d => d.id !== id.toString());
            save();
            render();
            // 注意：GAS需有對應的刪除邏輯，否則雲端會殘留
        }
    }

    function resetForm() {
        document.getElementById("in_name").value = "";
        document.querySelectorAll("input[type='number']").forEach(i => i.value = 0);
        document.getElementById("in_buyDate").value = "";
        document.getElementById("in_sellDate").value = "";
        document.getElementById("editId").innerText = "";
        document.getElementById("mainBtn").innerText = "新增紀錄";
        document.getElementById("mainBtn").style.background = "#4caf50";
        document.getElementById("cancelBtn").style.display = "none";
        document.getElementById("inputPanel").classList.remove("edit-mode");
    }

    function render() {
        const pcTbody = document.getElementById("pc_tbody");
        const mobList = document.getElementById("mobile_list");
        pcTbody.innerHTML = "";
        mobList.innerHTML = "";
        
        let sCount = 0, soldCount = 0, totalP = 0;

        data.forEach(i => {
            const cleanCat = i.category.split('_')[1];
            const pClass = i.profit >= 0 ? 'profit' : 'loss';
            const isSold = i.actual > 0;
            if(isSold) { soldCount++; totalP += i.profit; } else { sCount++; }

            pcTbody.innerHTML += `<tr>
                <td>${cleanCat}</td><td>${i.name}</td><td>$${i.purchase}</td>
                <td class="${pClass}">$${i.profit}</td><td>${i.roi}%</td>
                <td>${isSold ? '✅已售' : '📦在庫'}</td>
                <td><button onclick="edit('${i.id}')">改</button><button onclick="del('${i.id}')">刪</button></td>
            </tr>`;

            mobList.innerHTML += `<div class="card" style="border-left-color: ${isSold ? '#4caf50' : '#ff9800'}">
                <div class="card-row">
                    <span class="card-title">${cleanCat} - ${i.name}</span>
                    <span class="${pClass}">$${i.profit}</span>
                </div>
                <div class="card-grid">
                    <div>成本: $${i.purchase}</div><div>ROI: ${i.roi}%</div>
                    <div>持有: ${i.days}天</div><div>狀態: ${isSold ? '已售出' : '在庫'}</div>
                </div>
                <div class="card-actions">
                    <button class="btn-sm" style="background:#2196f3" onclick="edit('${i.id}')">編輯</button>
                    <button class="btn-sm" style="background:#f44336" onclick="del('${i.id}')">刪除</button>
                </div>
            </div>`;
        });

        document.getElementById("count_stock").innerText = sCount;
        document.getElementById("count_sold").innerText = soldCount;
        document.getElementById("total_profit").innerText = "$" + totalP;
    }
</script>
</body>
</html>
