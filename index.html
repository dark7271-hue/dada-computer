<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電腦翻修進銷存 - 強制同步版</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --primary: #4caf50;
            --accent: #2196f3; --text: #e0e0e0; --border: #333;
        }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { text-align: center; color: var(--primary); margin: 15px 0; }

        /* 狀態指示燈 */
        .sync-status { text-align: center; font-size: 0.8em; margin-bottom: 10px; color: var(--accent); }

        .summary-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .summary-item { flex: 1; background: var(--card-bg); padding: 10px; border-radius: 8px; text-align: center; border-bottom: 3px solid var(--primary); }
        .summary-item b { font-size: 1.2em; color: #fff; }

        .input-group { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .input-item { display: flex; flex-direction: column; }
        label { font-size: 0.8em; color: #888; margin-bottom: 4px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; }
        
        .btn-row { display: flex; gap: 10px; margin-top: 15px; justify-content: flex-end; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-main { background: var(--primary); color: white; flex-grow: 1; }
        .btn-main:disabled { background: #444; color: #888; cursor: not-allowed; }

        .desktop-table { width: 100%; border-collapse: collapse; background: var(--card-bg); display: none; margin-top: 20px; }
        .desktop-table th, .desktop-table td { padding: 12px; border: 1px solid var(--border); text-align: center; }
        .mobile-list { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; border-left: 5px solid var(--primary); }
        
        @media (min-width: 768px) {
            .desktop-table { display: table; }
            .mobile-list { display: none; }
            .input-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .profit { color: var(--primary); font-weight: bold; }
        .loss { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🖥️ 翻修進銷存系統</h2>
    <div id="syncStatus" class="sync-status">📡 正在檢查雲端連線...</div>

    <div class="summary-bar">
        <div class="summary-item"><span>在庫</span><b id="count_stock">0</b></div>
        <div class="summary-item"><span>已售</span><b id="count_sold">0</b></div>
        <div class="summary-item"><span>獲利</span><b id="total_profit">$0</b></div>
    </div>

    <div class="input-group" id="inputPanel">
        <div class="input-grid">
            <div class="input-item"><label>分類</label><select id="in_category"><option value="1_整機">整機</option><option value="2_主機板">主機板</option><option value="3_CPU">CPU</option><option value="4_記憶體">記憶體</option><option value="5_顯卡">顯卡</option><option value="6_硬碟">硬碟</option><option value="7_機殼">機殼</option><option value="8_風扇">風扇</option><option value="9_POWER">POWER</option></select></div>
            <div class="input-item"><label>品項名稱</label><input id="in_name" placeholder="規格型號"></div>
            <div class="input-item"><label>成本</label><input id="in_purchase" type="number" value="0"></div>
            <div class="input-item"><label>買入日期</label><input id="in_buyDate" type="date"></div>
            <div class="input-item"><label>預計售價</label><input id="in_expect" type="number" value="0"></div>
            <div class="input-item"><label>實際售價</label><input id="in_actual" type="number" value="0"></div>
            <div class="input-item"><label>賣出日期</label><input id="in_sellDate" type="date"></div>
        </div>
        <div class="btn-row">
            <span id="editId" style="display:none"></span>
            <button id="mainBtn" class="btn btn-main" onclick="handleSubmit()">儲存並同步到雲端</button>
        </div>
    </div>

    <table class="desktop-table">
        <thead><tr><th>分類</th><th>名稱</th><th>成本</th><th>利潤</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="pc_tbody"></tbody>
    </table>
    <div class="mobile-list" id="mobile_list"></div>
</div>

<script>
    const cloudUrl = "https://script.google.com/macros/s/AKfycbzTUCzO7Lx7XAi90_Sr9aHEyMfZdGIrdZG9lkwfI42w4-jDW-ZwGkMNf70rSxddGxcp/exec";
    let data = JSON.parse(localStorage.getItem("pcData") || "[]");

    window.onload = () => {
        render();
        loadFromCloud();
     // 每5秒同步（手機關鍵）
    setInterval(loadFromCloud, 5000);
};

    async function loadFromCloud() {
        try {
            const res = await fetch(cloudUrl);
            const cloudData = await res.json();
            if (cloudData) {
const map = new Map();

[...data, ...cloudData].forEach(i => {
    map.set(i.id, i);
});

data = Array.from(map.values());
                localStorage.setItem("pcData", JSON.stringify(data));
                render();
                document.getElementById("syncStatus").innerText = "✅ 雲端同步完成";
            }
        } catch (e) {
            document.getElementById("syncStatus").innerText = "⚠️ 離線模式 (僅讀取本機)";
        }
    }

    async function handleSubmit() {
        const btn = document.getElementById("mainBtn");
        const id = document.getElementById("editId").innerText;
        const item = {
            id: id || Date.now().toString(),
            category: document.getElementById("in_category").value,
            name: document.getElementById("in_name").value || "未命名",
            purchase: Number(document.getElementById("in_purchase").value),
            expect: Number(document.getElementById("in_expect").value),
            actual: Number(document.getElementById("in_actual").value),
            buyDate: document.getElementById("in_buyDate").value,
            sellDate: document.getElementById("in_sellDate").value
        };

        btn.disabled = true;
        btn.innerText = "同步中...";

        try {
            // 關鍵修改：不使用 no-cors，改用正常模式
await fetch(cloudUrl, {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify(item)
});
            
// 等GAS寫入完成（關鍵）
setTimeout(async () => {
    await loadFromCloud();
}, 1200);
            resetForm();
        } catch (e) {
            alert("同步失敗，請確認網路連線！");
        } finally {
            btn.disabled = false;
            btn.innerText = "儲存並同步到雲端";
        }
    }

    function resetForm() {
        document.getElementById("in_name").value = "";
        document.querySelectorAll("input[type='number']").forEach(i => i.value = 0);
        document.getElementById("editId").innerText = "";
    }

    function render() {
        const pcTbody = document.getElementById("pc_tbody");
        const mobList = document.getElementById("mobile_list");
        pcTbody.innerHTML = ""; mobList.innerHTML = "";
        let sCount = 0, soldCount = 0, totalP = 0;

        data.forEach(i => {
            const isSold = Number(i.actual) > 0;
            const finalPrice = isSold ? i.actual : i.expect;
            const profit = finalPrice - i.purchase;
            if(isSold) { soldCount++; totalP += profit; } else { sCount++; }

            pcTbody.innerHTML += `<tr><td>${i.category.split('_')[1]}</td><td>${i.name}</td><td>$${i.purchase}</td><td class="${profit>=0?'profit':'loss'}">$${profit}</td><td>${isSold?'已售':'在庫'}</td><td><button onclick="edit('${i.id}')">改</button></td></tr>`;
            mobList.innerHTML += `<div class="card" style="border-left-color:${isSold?'#4caf50':'#ff9800'}"><b>${i.name}</b><br>利潤: <span class="${profit>=0?'profit':'loss'}">$${profit}</span></div>`;
        });

        document.getElementById("count_stock").innerText = sCount;
        document.getElementById("count_sold").innerText = soldCount;
        document.getElementById("total_profit").innerText = "$" + totalP;
    }

    function edit(id) {
        const item = data.find(d => d.id.toString() === id.toString());
        if(!item) return;
        document.getElementById("editId").innerText = item.id;
        document.getElementById("in_category").value = item.category;
        document.getElementById("in_name").value = item.name;
        document.getElementById("in_purchase").value = item.purchase;
        document.getElementById("in_expect").value = item.expect;
        document.getElementById("in_actual").value = item.actual;
        document.getElementById("in_buyDate").value = item.buyDate;
        document.getElementById("in_sellDate").value = item.sellDate;
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
