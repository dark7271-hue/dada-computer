<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --primary: #22c55e;
  --accent: #3b82f6;
  --text: #e2e8f0;
  --muted: #94a3b8;
}

body {
  font-family: -apple-system, BlinkMacSystemFont;
  background: linear-gradient(135deg, #0f172a, #020617);
  color: var(--text);
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

/* 🔥 KPI卡片 */
.summary-bar {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

.summary-item {
  background: var(--card);
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.summary-item span {
  color: var(--muted);
  font-size: 13px;
}

.summary-item b {
  font-size: 26px;
  display: block;
  margin-top: 5px;
}

/* 🔥 輸入卡片 */
.input-group {
  background: var(--card);
  padding: 20px;
  border-radius: 16px;
  margin-top: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.input-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
  gap: 12px;
}

label {
  font-size: 12px;
  color: var(--muted);
}

input, select {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #020617;
  color: white;
}

/* 🔥 按鈕 */
.btn {
  border-radius: 10px;
  padding: 12px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.btn-main {
  background: linear-gradient(135deg,#22c55e,#16a34a);
  color: white;
}

.btn-cancel {
  background: #475569;
  color: white;
}

/* 🔥 表格 */
.desktop-table {
  margin-top: 20px;
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  border-radius: 12px;
}

.desktop-table th {
  background: #020617;
  padding: 12px;
  color: var(--accent);
}

.desktop-table td {
  padding: 12px;
  background: var(--card);
  border-bottom: 1px solid #334155;
}

.desktop-table tr:hover td {
  background: #020617;
}

/* 🔥 卡片 */
.card {
  background: var(--card);
  padding: 15px;
  border-radius: 14px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-3px);
}

.card-title {
  font-size: 16px;
  font-weight: bold;
}

.card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-top: 10px;
  font-size: 13px;
  color: var(--muted);
}

/* 🔥 利潤顏色 */
.profit { color: #22c55e; }
.loss { color: #ef4444; }

/* 手機 */
@media(max-width:768px){
  .desktop-table { display:none; }
}
</style>
