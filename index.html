<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>翻修進銷存（最強試算表版）</title>

<style>
body { background:#111; color:#eee; font-family:Arial; padding:20px;}
input { margin:5px; padding:8px;}
button { padding:8px;}
.card { background:#222; padding:10px; margin:10px 0; border-radius:8px;}
.profit{color:#4caf50;} .loss{color:#f44336;}
</style>
</head>

<body>

<h2>🖥️ 翻修進銷存（雲端同步）</h2>

<input id="name" placeholder="名稱">
<input id="cost" type="number" placeholder="成本">
<input id="price" type="number" placeholder="售價">

<button onclick="save()">新增 / 更新</button>

<hr>

<div id="list"></div>

<script>

const API = "你的GAS網址";

let data = [];
let editId = "";

// 讀取
async function load(){
  const res = await fetch(API);
  data = await res.json();

  render();
}

// 新增 / 更新
async function save(){
  const item = {
    id: editId || Date.now().toString(),
    name: name.value,
    purchase: Number(cost.value),
    actual: Number(price.value)
  };

  await fetch(API, {
    method:"POST",
    headers:{ "Content-Type":"application/json"},
    body: JSON.stringify(item)
  });

  editId = "";
  name.value = "";
  cost.value = "";
  price.value = "";

  load();
}

// 刪除
async function del(id){
  await fetch(API + "?id=" + id, { method:"DELETE" });
  load();
}

// 編輯
function edit(id){
  const i = data.find(d=>d.id==id);
  editId = id;
  name.value = i.name;
  cost.value = i.purchase;
  price.value = i.actual;
}

// 顯示
function render(){
  let html = "";

  data.reverse().forEach(d=>{
    const profit = d.actual - d.purchase;

    html += `
      <div class="card">
        <b>${d.name}</b><br>
        成本:${d.purchase} / 售價:${d.actual}<br>
        利潤:<span class="${profit>=0?'profit':'loss'}">${profit}</span><br>
        <button onclick="edit('${d.id}')">編輯</button>
        <button onclick="del('${d.id}')">刪除</button>
      </div>
    `;
  });

  list.innerHTML = html;
}

// 自動同步
setInterval(load, 5000);
load();

</script>

</body>
</html>
