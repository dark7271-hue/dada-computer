<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>硬體管理</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">硬體管理</h1> 

    <div class="card mb-4">
      <div class="card-body">
        <form id="itemForm" class="row g-3">
          <div class="col-md-3">
            <label class="form-label">日期</label>
            <input type="date" name="date" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">硬體名稱</label>
            <input type="text" name="name" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">取得成本</label>
            <input type="number" name="cost" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">預估售價</label>
            <input type="number" name="expected" class="form-control" />
          </div>
          <div class="col-md-2">
            <label class="form-label">實際售價</label>
            <input type="number" name="actual" class="form-control" />
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">新增</button>
            <button id="refreshBtn" type="button" class="btn btn-outline-secondary ms-2">重新整理</button>
            <span id="msg" class="ms-3 text-success"></span>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table id="dataTable" class="table table-striped table-bordered align-middle">
            <thead class="table-light">
              <tr>
                <th>日期</th>
                <th>硬體名稱</th>
                <th>取得成本</th>
                <th>預估售價</th>
                <th>實際售價</th>
                <th>總成本</th>
                <th>預計利潤</th>
                <th>實際利潤</th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot class="table-light">
              <tr>
                <th colspan="2">合計</th>
                <th id="sumCost" class="text-end">0</th>
                <th id="sumExpected" class="text-end">0</th>
                <th id="sumActual" class="text-end">0</th>
                <th id="sumTotalCost" class="text-end">0</th>
                <th id="sumExpProfit" class="text-end">0</th>
                <th id="sumActProfit" class="text-end">0</th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyxnGpRY_VJSFJgy0QOflFPyI6XpWAD35wxupjRuDP7KiWzgwwzun0tjR3lsPaH8-ZC/exec";

    const form = document.getElementById('itemForm');
    const tbody = document.querySelector('#dataTable tbody');
    const msgEl = document.getElementById('msg');
    const refreshBtn = document.getElementById('refreshBtn');

    // 金額顯示整數並加千分位
    function formatNumber(n) { 
      return Math.round(Number(n || 0)).toLocaleString('zh-TW'); 
    }

    // 格式化日期：只保留 YYYY-MM-DD
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const r = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${r}`;
    }

    async function fetchData() {
      try {
        const resp = await fetch(GAS_WEB_APP_URL + '?action=get');
        if (!resp.ok) throw new Error('Fetch error');
        const data = await resp.json();
        renderTable(data);
      } catch (e) {
        console.error(e);
        msgEl.textContent = '取得資料失敗';
        msgEl.classList.add('text-danger');
      }
    }

    function renderTable(data) {
      tbody.innerHTML = '';
      let sumCost = 0, sumExpected = 0, sumActual = 0;
      
      (data || []).forEach(row => {
        const cost = parseFloat(row.cost) || 0;
        const expected = parseFloat(row.expected) || 0;
        const actual = parseFloat(row.actual) || 0;
        const totalCost = cost;
        const expProfit = expected - totalCost;
        const actProfit = actual - totalCost;

        sumCost += cost;
        sumExpected += expected;
        sumActual += actual;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDate(row.date)}</td> 
          <td>${row.name || ''}</td>
          <td class="text-end">${formatNumber(cost)}</td>
          <td class="text-end">${formatNumber(expected)}</td>
          <td class="text-end">${formatNumber(actual)}</td>
          <td class="text-end">${formatNumber(totalCost)}</td>
          <td class="text-end">${formatNumber(expProfit)}</td>
          <td class="text-end">${formatNumber(actProfit)}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('sumCost').textContent = formatNumber(sumCost);
      document.getElementById('sumExpected').textContent = formatNumber(sumExpected);
      document.getElementById('sumActual').textContent = formatNumber(sumActual);
      document.getElementById('sumTotalCost').textContent = formatNumber(sumCost);
      document.getElementById('sumExpProfit').textContent = formatNumber(sumExpected - sumCost);
      document.getElementById('sumActProfit').textContent = formatNumber(sumActual - sumCost);
      
      msgEl.textContent = '';
      msgEl.classList.remove('text-danger');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = '送出中...';
      msgEl.classList.add('text-success');

      const formData = new URLSearchParams(new FormData(form));
      formData.append('action', 'add');

      try {
        const resp = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: formData.toString(),
          credentials: 'omit'
        });
        const result = await resp.json();
        if (result && result.status === 'success') {
          msgEl.textContent = '新增成功';
          form.reset();
          fetchData();
        } else {
          throw new Error('寫入失敗');
        }
      } catch (err) {
        console.error(err);
        msgEl.textContent = '寫入失敗';
        msgEl.classList.add('text-danger');
      }
    });

    refreshBtn.addEventListener('click', fetchData);
    fetchData();
  </script>
</body>
</html>
