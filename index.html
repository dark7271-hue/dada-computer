<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>硬體管理系統 - 進階版</title> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    .editing { background-color: #fff3cd !important; border: 1px solid #ffeeba; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">硬體管理 (編輯/刪除版)</h1> 

    <!-- 表單區 -->
    <div class="card mb-4" id="formCard">
      <div class="card-body">
        <form id="itemForm" class="row g-3">
          <!-- 隱藏的行號欄位，用來判斷是新增還是更新 -->
          <input type="hidden" name="rowIdx" id="rowIdx" />
          
          <div class="col-md-3">
            <label class="form-label">日期</label>
            <input type="date" name="date" id="f_date" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">硬體名稱</label>
            <input type="text" name="name" id="f_name" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">取得成本</label>
            <input type="number" name="cost" id="f_cost" class="form-control" required />
          </div>
          <div class="col-md-2">
            <label class="form-label">預估售價</label>
            <input type="number" name="expected" id="f_expected" class="form-control" />
          </div>
          <div class="col-md-2">
            <label class="form-label">實際售價</label>
            <input type="number" name="actual" id="f_actual" class="form-control" />
          </div>
          <div class="col-12">
            <button type="submit" id="submitBtn" class="btn btn-primary">新增資料</button>
            <button type="button" id="cancelBtn" class="btn btn-secondary d-none" onclick="resetForm()">取消編輯</button>
            <button id="refreshBtn" type="button" class="btn btn-outline-secondary ms-2">重新整理清單</button>
            <span id="msg" class="ms-3"></span>
          </div>
        </form>
      </div>
    </div>

    <!-- 資料表格 -->
    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table id="dataTable" class="table table-striped table-bordered align-middle">
            <thead class="table-light text-center">
              <tr>
                <th>日期</th>
                <th>硬體名稱</th>
                <th>取得成本</th>
                <th>預估售價</th>
                <th>實際售價</th>
                <th>總成本</th>
                <th>預計利潤</th>
                <th>實際利潤</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot class="table-light">
              <tr>
                <th colspan="2" class="text-center">合計</th>
                <th id="sumCost" class="text-end">0</th>
                <th id="sumExpected" class="text-end">0</th>
                <th id="sumActual" class="text-end">0</th>
                <th id="sumTotalCost" class="text-end">0</th>
                <th id="sumExpProfit" class="text-end">0</th>
                <th id="sumActProfit" class="text-end">0</th>
                <th></th>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyxnGpRY_VJSFJgy0QOflFPyI6XpWAD35wxupjRuDP7KiWzgwwzun0tjR3lsPaH8-ZC/exec";

    const form = document.getElementById('itemForm');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formCard = document.getElementById('formCard');
    const msgEl = document.getElementById('msg');

    // 格式化數字
    function formatNumber(n) { 
      return Math.round(Number(n || 0)).toLocaleString('zh-TW'); 
    }

    // 格式化日期 (處理 GAS 傳回的字串)
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const r = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${r}`;
    }

    // 讀取資料
    async function fetchData() {
      msgEl.textContent = '讀取中...';
      try {
        const resp = await fetch(GAS_WEB_APP_URL + '?action=get');
        const data = await resp.json();
        renderTable(data);
        msgEl.textContent = '';
      } catch (e) {
        msgEl.textContent = '讀取失敗';
        msgEl.className = 'ms-3 text-danger';
      }
    }

    // 渲染表格
    function renderTable(data) {
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = '';
      let sumCost = 0, sumExpected = 0, sumActual = 0;
      
      (data || []).forEach(row => {
        const cost = parseFloat(row.cost) || 0;
        const expected = parseFloat(row.expected) || 0;
        const actual = parseFloat(row.actual) || 0;
        const totalCost = cost;
        const expProfit = expected - totalCost;
        const actProfit = actual - totalCost;

        sumCost += cost;
        sumExpected += expected;
        sumActual += actual;

        const tr = document.createElement('tr');
        // 為了方便編輯，我們把原始 row 資料轉成字串存在按鈕屬性中
        const rowData = JSON.stringify(row).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

        tr.innerHTML = `
          <td class="text-center">${formatDate(row.date)}</td> 
          <td>${row.name || ''}</td>
          <td class="text-end">${formatNumber(cost)}</td>
          <td class="text-end">${formatNumber(expected)}</td>
          <td class="text-end">${formatNumber(actual)}</td>
          <td class="text-end">${formatNumber(totalCost)}</td>
          <td class="text-end">${formatNumber(expProfit)}</td>
          <td class="text-end">${formatNumber(actProfit)}</td>
          <td class="text-center">
            <button class="btn btn-sm btn-warning mb-1" onclick='prepareEdit(${rowData})'>編輯</button>
            <button class="btn btn-sm btn-danger mb-1" onclick="deleteRow(${row.rowIdx})">刪除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('sumCost').textContent = formatNumber(sumCost);
      document.getElementById('sumExpected').textContent = formatNumber(sumExpected);
      document.getElementById('sumActual').textContent = formatNumber(sumActual);
      document.getElementById('sumTotalCost').textContent = formatNumber(sumCost);
      document.getElementById('sumExpProfit').textContent = formatNumber(sumExpected - sumCost);
      document.getElementById('sumActProfit').textContent = formatNumber(sumActual - sumCost);
    }

    // 刪除功能
    async function deleteRow(rowIdx) {
      if (!confirm('確定要刪除這筆資料嗎？')) return;
      msgEl.textContent = '刪除中...';
      try {
        await fetch(`${GAS_WEB_APP_URL}?action=delete&rowIdx=${rowIdx}`, { method: 'POST' });
        fetchData();
      } catch (e) {
        alert('刪除失敗');
      }
    }

    // 進入編輯模式
    function prepareEdit(data) {
      document.getElementById('rowIdx').value = data.rowIdx;
      document.getElementById('f_date').value = formatDate(data.date);
      document.getElementById('f_name').value = data.name;
      document.getElementById('f_cost').value = data.cost;
      document.getElementById('f_expected').value = data.expected;
      document.getElementById('f_actual').value = data.actual;

      formCard.classList.add('editing');
      submitBtn.textContent = '更新資料';
      submitBtn.className = 'btn btn-warning';
      cancelBtn.classList.remove('d-none');
      window.scrollTo(0, 0); // 捲動回頂端方便編輯
    }

    // 重設表單狀態
    function resetForm() {
      form.reset();
      document.getElementById('rowIdx').value = '';
      formCard.classList.remove('editing');
      submitBtn.textContent = '新增資料';
      submitBtn.className = 'btn btn-primary';
      cancelBtn.classList.add('d-none');
    }

    // 表單送出處理 (新增或更新)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const rowIdx = document.getElementById('rowIdx').value;
      const action = rowIdx ? 'update' : 'add';
      
      msgEl.textContent = rowIdx ? '更新中...' : '送出中...';
      msgEl.className = 'ms-3 text-success';

      const formData = new URLSearchParams(new FormData(form));
      formData.append('action', action);

      try {
        const resp = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData.toString()
        });
        const result = await resp.json();
        if (result.status === 'success') {
          msgEl.textContent = rowIdx ? '更新成功' : '新增成功';
          resetForm();
          fetchData();
        }
      } catch (err) {
        msgEl.textContent = '操作失敗';
        msgEl.className = 'ms-3 text-danger';
      }
    });

    document.getElementById('refreshBtn').addEventListener('click', fetchData);
    fetchData(); // 初始載入
  </script>
</body>
</html>
