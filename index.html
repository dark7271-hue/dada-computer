<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🖥️ 翻修進銷存系統</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --primary: #46b760;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --border: #3a3a3c;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        h2 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; }

        /* 統計面板 - 參照圖片 */
        .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .summary-item { background: var(--card-bg); padding: 12px 5px; border-radius: 10px; text-align: center; border-bottom: 2px solid #2d5a36; }
        .summary-item span { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
        .summary-item b { font-size: 18px; color: var(--text-main); }
        .summary-item b.money { color: var(--text-main); }

        /* 輸入區域卡片 */
        .input-card { background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 25px; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full-width { grid-column: span 2; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; color: var(--text-sub); margin-left: 2px; }
        input, select { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }

        .btn-submit { background: var(--primary); color: white; border: none; border-radius: 8px; padding: 15px; font-size: 18px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; transition: opacity 0.2s; }
        .btn-submit:active { opacity: 0.8; }

        /* 列表部分 */
        .list-header { color: var(--primary); font-weight: bold; margin: 15px 0 10px; padding-left: 5px; border-left: 3px solid var(--primary); }
        .item-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .item-info { display: flex; flex-direction: column; gap: 4px; }
        .item-name { font-weight: bold; font-size: 16px; }
        .item-meta { font-size: 12px; color: var(--text-sub); }
        .item-price { text-align: right; }
        .profit-text { color: var(--primary); font-weight: bold; font-size: 16px; }
        .loss-text { color: #ff453a; font-weight: bold; font-size: 16px; }
        
        .sync-status { text-align: center; font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💻 翻修進銷存系統</h2>
    <div id="status" class="sync-status">雲端同步中...</div>

    <!-- 統計數據 -->
    <div class="summary-bar">
        <div class="summary-item"><span>在庫項目</span><b id="count_stock">0</b></div>
        <div class="summary-item"><span>已售項目</span><b id="count_sold">0</b></div>
        <div class="summary-item"><span>累計獲利</span><b id="total_profit">$0</b></div>
    </div>

    <!-- 輸入表單 -->
    <div class="input-card">
        <div class="input-grid">
            <div class="input-group">
                <label>分類</label>
                <select id="in_category">
                    <option value="整機">整機</option>
                    <option value="零件">零件</option>
                </select>
            </div>
            <div class="input-group">
                <label>品項名稱</label>
                <input id="in_name" placeholder="規格型號">
            </div>
            <div class="input-group">
                <label>收購/總成本</label>
                <input id="in_purchase" type="number" value="0">
            </div>
            <div class="input-group">
                <label>買入日期</label>
                <input id="in_buyDate" type="date">
            </div>
            <div class="input-group">
                <label>預計售價</label>
                <input id="in_expect" type="number" value="0">
            </div>
            <div class="input-group">
                <label>實際售價</label>
                <input id="in_actual" type="number" value="0">
            </div>
            <div class="input-group full-width">
                <label>賣出日期</label>
                <input id="in_sellDate" type="date">
            </div>
        </div>
        <button class="btn-submit" onclick="handleSubmit()">新增紀錄</button>
    </div>

    <div class="list-header">近期紀錄</div>
    <div class="item-list" id="display_list"></div>
</div>

<script>
    // 請替換為你的 Google Apps Script 部署網址
    const cloudUrl = "https://script.google.com/macros/s/AKfycbwekfeIe022l7YxoMGAcn2fsCck3ZsPDPdI_UsteFdHOvaSNCtmnXxQCxbd7k2HUSzj/exec"; 
    let localData = JSON.parse(localStorage.getItem("pcData") || "[]");

    window.onload = () => {
        render();
        loadFromCloud();
    };

    async function loadFromCloud() {
        try {
            const res = await fetch(cloudUrl);
            const data = await res.json();
            if (data) {
                localData = data;
                localStorage.setItem("pcData", JSON.stringify(localData));
                render();
                document.getElementById("status").innerText = "● 雲端已同步";
            }
        } catch (e) {
            document.getElementById("status").innerText = "○ 離線模式";
        }
    }

    async function handleSubmit() {
        const btn = document.querySelector(".btn-submit");
        const item = {
            id: Date.now().toString(),
            category: document.getElementById("in_category").value,
            name: document.getElementById("in_name").value || "未命名",
            purchase: Number(document.getElementById("in_purchase").value),
            buyDate: document.getElementById("in_buyDate").value,
            expect: Number(document.getElementById("in_expect").value),
            actual: Number(document.getElementById("in_actual").value),
            sellDate: document.getElementById("in_sellDate").value
        };

        // UI 立即反應
        localData.unshift(item);
        render();
        btn.innerText = "同步中...";
        btn.disabled = true;

        try {
            await fetch(cloudUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
            document.getElementById("status").innerText = "資料已上傳試算表";
            setTimeout(loadFromCloud, 1000);
        } catch (e) {
            alert("同步失敗，資料僅存於本地");
        } finally {
            btn.innerText = "新增紀錄";
            btn.disabled = false;
            // 清空部分欄位
            document.getElementById("in_name").value = "";
            document.getElementById("in_actual").value = 0;
        }
    }

    function render() {
        const listDiv = document.getElementById("display_list");
        listDiv.innerHTML = "";
        let stock = 0, sold = 0, profit = 0;

        localData.forEach(i => {
            const isSold = Number(i.actual) > 0;
            const itemProfit = isSold ? (Number(i.actual) - Number(i.purchase)) : 0;
            
            if(isSold) { sold++; profit += itemProfit; } else { stock++; }

            listDiv.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <span class="item-name">${i.category} - ${i.name}</span>
                        <span class="item-meta">成本: $${i.purchase} | ${isSold ? '售出: '+i.sellDate : '在庫'}</span>
                    </div>
                    <div class="item-price">
                        <span class="${itemProfit >= 0 ? 'profit-text' : 'loss-text'}">
                            ${isSold ? '$'+itemProfit : '預售 $'+i.expect}
                        </span>
                    </div>
                </div>
            `;
        });

        document.getElementById("count_stock").innerText = stock;
        document.getElementById("count_sold").innerText = sold;
        document.getElementById("total_profit").innerText = "$" + profit;
    }
</script>
</body>
</html>
