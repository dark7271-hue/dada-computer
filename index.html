<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電腦翻修進銷存 - 強制版</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --primary: #4caf50;
            --accent: #2196f3; --text: #e0e0e0; --border: #333;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h2 { text-align: center; color: var(--primary); }
        
        /* 統計面板 */
        .summary-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .summary-item { flex: 1; background: var(--card-bg); padding: 10px; border-radius: 8px; text-align: center; border-bottom: 3px solid var(--primary); }
        .summary-item b { font-size: 1.2em; color: #fff; }

        /* 輸入區 */
        .input-group { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        input, select { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #2c2c2c; color: white; font-size: 16px; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; }
        .sync-status { text-align: center; font-size: 0.8em; color: var(--accent); margin-bottom: 10px; }

        /* 響應式佈局 */
        .desktop-table { width: 100%; border-collapse: collapse; display: none; background: var(--card-bg); }
        .desktop-table th, td { padding: 10px; border: 1px solid var(--border); text-align: center; }
        .mobile-list { display: flex; flex-direction: column; gap: 10px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; border-left: 5px solid var(--primary); }
        
        @media (min-width: 768px) {
            .desktop-table { display: table; }
            .mobile-list { display: none; }
            .input-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .profit { color: var(--primary); }
        .loss { color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <h2>🖥️ 翻修進銷存 (雲端同步)</h2>
    <div id="syncIndicator" class="sync-status">雲端同步中...</div>

    <div class="summary-bar">
        <div class="summary-item"><span>在庫</span><b id="count_stock">0</b></div>
        <div class="summary-item"><span>已售</span><b id="count_sold">0</b></div>
        <div class="summary-item"><span>獲利</span><b id="total_profit">$0</b></div>
    </div>

    <div class="input-group">
        <div class="input-grid">
            <select id="in_category"><option value="1_整機">整機</option><option value="2_零件">零件</option></select>
            <input id="in_name" placeholder="規格名稱">
            <input id="in_purchase" type="number" placeholder="成本">
            <input id="in_buyDate" type="date">
            <input id="in_actual" type="number" placeholder="實際售價">
            <input id="in_sellDate" type="date">
        </div>
        <button class="btn-main" onclick="handleSubmit()">新增並同步到雲端</button>
    </div>

    <table class="desktop-table">
        <thead><tr><th>分類</th><th>名稱</th><th>成本</th><th>利潤</th><th>狀態</th></tr></thead>
        <tbody id="pc_tbody"></tbody>
    </table>
    <div class="mobile-list" id="mobile_list"></div>
</div>

<script>
    const cloudUrl = "https://script.google.com/macros/s/AKfycbxnzRhThsLybN4_rnouTLdn_2w4F8UKuqtiL8_MpSrEXqmxwZtz4uX6_rRpgvzGRVMz/exec"; // <--- 請務必換成你的網址
    let data = JSON.parse(localStorage.getItem("pcData") || "[]");

    // 核心優化 1：開啟網頁立即抓取雲端資料
    window.onload = async () => {
        render(); // 先畫出舊的
        await loadFromCloud(); 
    };

    async function loadFromCloud() {
        try {
            const res = await fetch(cloudUrl);
            const cloudData = await res.json();
            if (cloudData && cloudData.length > 0) {
                data = cloudData;
                localStorage.setItem("pcData", JSON.stringify(data));
                render();
                document.getElementById("syncIndicator").innerText = "● 雲端連線正常";
            }
        } catch (e) {
            document.getElementById("syncIndicator").innerText = "○ 離線模式";
        }
    }

    async function handleSubmit() {
        const item = {
            id: Date.now().toString(),
            category: document.getElementById("in_category").value,
            name: document.getElementById("in_name").value || "未命名",
            purchase: Number(document.getElementById("in_purchase").value),
            actual: Number(document.getElementById("in_actual").value),
            buyDate: document.getElementById("in_buyDate").value,
            sellDate: document.getElementById("in_sellDate").value
        };

        // 核心優化 2：先更新本地，再推雲端，最後再抓一次雲端確保對齊
        data.push(item);
        render();
        
        document.getElementById("syncIndicator").innerText = "上傳中...";
        await fetch(cloudUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(item) });
        
        setTimeout(loadFromCloud, 1500); // 延遲一下抓回最新排序後的資料
    }

    function render() {
        const pcTbody = document.getElementById("pc_tbody");
        const mobList = document.getElementById("mobile_list");
        pcTbody.innerHTML = ""; mobList.innerHTML = "";
        
        let sCount = 0, soldCount = 0, totalP = 0;

        data.forEach(i => {
            const isSold = i.actual > 0;
            const profit = (i.actual || 0) - i.purchase;
            if(isSold) { soldCount++; totalP += profit; } else { sCount++; }

            const html = `<div>${i.name} | 成本:$${i.purchase} | <span class="${profit >=0 ? 'profit' : 'loss'}">利潤:$${profit}</span></div>`;
            pcTbody.innerHTML += `<tr><td>${i.category}</td><td>${i.name}</td><td>${i.purchase}</td><td>${profit}</td><td>${isSold?'已售':'在庫'}</td></tr>`;
            mobList.innerHTML += `<div class="card" style="border-left-color:${isSold?'#4caf50':'#ff9800'}">${html}</div>`;
        });

        document.getElementById("count_stock").innerText = sCount;
        document.getElementById("count_sold").innerText = soldCount;
        document.getElementById("total_profit").innerText = "$" + totalP;
    }
</script>
</body>
</html>
